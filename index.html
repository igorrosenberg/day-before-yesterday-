<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff6600">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Yesterday on HN</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script>
  // Carry the page's ?v=<timestamp> (set by "Reload app") onto the CSS and JS URLs so they bypass the cache too.
  window.APP_V = new URLSearchParams(location.search).get('v') || '';
  window.withV = (f) => (APP_V ? `${f}?v=${encodeURIComponent(APP_V)}` : f);
  document.write(`<link rel="stylesheet" href="${withV('style.css')}">`);
</script>
<noscript><link rel="stylesheet" href="style.css"></noscript>
</head>
<body>
<header id="bar">
  <button id="back" class="icon" hidden aria-label="Back">&#8249;</button>
  <h1 id="heading">Yesterday</h1>
  <button id="toggleRead" class="text" aria-pressed="false">Hide read</button>
  <button id="refresh" class="icon" aria-label="Refresh">&#8635;</button>
</header>

<main>
  <section id="listView">
    <p id="subtitle" class="muted"></p>
    <ol id="list"></ol>
    <p id="listStatus" class="status"></p>
    <p class="hint muted">Swipe right to read &middot; swipe left to mark read &middot; <a id="reload" href="./">Reload app</a></p>
  </section>

  <section id="readView" hidden>
    <article id="story"></article>
    <h2 class="section">20 most insightful comments</h2>
    <p class="muted small">Tap a comment to copy it.</p>
    <ol id="comments"></ol>
    <p id="commentStatus" class="status"></p>
  </section>
</main>

<div id="toast" role="status" aria-live="polite"></div>
<script>document.write(`<script src="${withV('app.js')}"><\/script>`);</script>
</body>
</html>
