<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff6600">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Yesterday on HN</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script>
  // Carry the page's ?v=<timestamp> (set by "Reload app") onto the CSS and JS URLs so they bypass the cache too.
  window.APP_V = new URLSearchParams(location.search).get('v') || '';
  window.withV = (f) => (APP_V ? `${f}?v=${encodeURIComponent(APP_V)}` : f);
</script>
<link id="css" rel="stylesheet" href="style.css">
<script>if (APP_V) document.getElementById('css').href = withV('style.css');</script>
</head>
<body>
<header id="bar">
  <button id="back" class="icon" hidden aria-label="Back">&#8249;</button>
  <h1 id="heading">Hacker News</h1>
  <button id="toggleRead" class="text" aria-pressed="false">Hide read</button>
  <button id="refresh" class="icon" aria-label="Refresh">&#8635;</button>
  <button id="settingsBtn" class="icon" aria-label="Settings">&#9881;</button>
</header>
<div id="ptr" aria-hidden="true"><span>&#8635;</span></div>

<main>
  <section id="listView">
    <p id="subtitle" class="muted"></p>
    <ol id="list"></ol>
    <p id="listStatus" class="status"></p>
    <p class="hint muted">Swipe right to read &middot; swipe left to mark read &middot; pull down to refresh &middot; <a id="reload" href="./">Reload app</a></p>
  </section>

  <section id="readView" hidden>
    <article id="story"></article>
    <h2 class="section" id="commentsHeading">Most insightful comments</h2>
    <p class="muted small">Tap a comment to copy it &middot; swipe left for the list, right for the next unread story.</p>
    <ol id="comments"></ol>
    <p id="commentStatus" class="status"></p>
  </section>
</main>

<dialog id="settings">
  <form method="dialog">
    <h2>Settings</h2>
    <label>Stories to show <input id="setTopN" type="number" min="5" max="100" step="5" inputmode="numeric"></label>
    <label>Comments per story <input id="setComments" type="number" min="5" max="50" step="5" inputmode="numeric"></label>
    <label>Days back <input id="setDaysBack" type="number" min="1" max="7" step="1" inputmode="numeric">
      <span class="muted small">1 = yesterday, 2 = the day before (stories have had a full day of votes)</span></label>
    <div class="actions">
      <button value="cancel" formnovalidate>Cancel</button>
      <button value="save" class="primary">Save</button>
    </div>
  </form>
</dialog>

<div id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastAction" hidden></button></div>
<script>
  const s = document.createElement('script');
  s.src = withV('app.js');
  document.body.append(s);
</script>
</body>
</html>
